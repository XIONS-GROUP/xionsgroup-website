<!doctype html>
<html lang="fr">
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <input name="subject" />
      <input name="subject-detail" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
