[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26.6.0"

# The project is a pre-launch holding page. Remove the global noindex
# only when the full production website is approved for launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
